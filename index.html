<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07090d"><title>ATENDIX — by Site Fácil TO</title><link rel="stylesheet" href="style.css">
</head>
<body>
<section id="auth" class="auth">
  <div class="brand"><b>A</b><div><strong>ATENDIX</strong><small>by Site Fácil TO</small></div></div>
  <div class="auth-card">
    <small>GESTÃO DE ATENDIMENTOS</small><h1 id="authTitle">Entrar no painel</h1>
    <form id="authForm"><input id="email" type="email" placeholder="E-mail" autocomplete="email" required><input id="password" type="password" placeholder="Senha" autocomplete="current-password" minlength="6" required><button class="primary" id="authSubmit">Entrar</button></form>
    <button class="secondary full" id="google" type="button">Continuar com Google</button>
    <button class="link" id="toggle" type="button">Criar minha conta</button>
    <button class="link small" id="forgot" type="button">Esqueci minha senha</button>
    <p id="configWarn" class="notice"></p>
  </div>
</section>
<div id="app" class="hidden">
  <aside><div class="brand"><b>A</b><div><strong>ATENDIX</strong><small>by Site Fácil TO</small></div></div><div id="tenant" class="tenant">Minha empresa</div><nav id="nav"></nav><button id="logout" class="secondary full" type="button">Sair</button></aside>
  <main><header><button id="menu" type="button">☰</button><div><small>PAINEL</small><h2 id="title">Dashboard</h2></div><span id="emailTop"></span></header><div id="content"></div></main>
</div>
<div id="modal" class="modal hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script>
</body></html>
